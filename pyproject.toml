[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pyline"
version = "0.1.0"
description = "Production-grade asyncio game server framework (rebuilt from ServerLite prototype)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "pyline" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "json5>=0.9",
    "msgpack>=1.0",
    "pyzmq>=26.0",
    "redis>=5.0",
    "asyncmy>=0.2.9",
    "cryptography>=42",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "watchfiles>=0.21",
    "aioconsole>=0.8",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "coverage[toml]>=7.5",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: tests that need real processes or network",
    "mysql: tests that need a live MySQL server",
    "redis: tests that need a live Redis server",
]

[tool.coverage.run]
source = ["src/pyline"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear (catches bare except patterns, mutable defaults...)
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["zmq.*", "asyncmy.*", "aioconsole.*", "watchfiles.*", "msgpack.*", "json5.*", "structlog.*", "prometheus_client.*"]
ignore_missing_imports = true
