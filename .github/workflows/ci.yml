name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      # tests are type-checked too, under the relaxed override declared in
      # pyproject (fixture/test doubles keep pragmatic annotations; real
      # type errors in test code are still caught)
      - run: uv run mypy src tests

  test:
    strategy:
      matrix:
        # Windows is a first-class dev/deploy platform for this repo (win32
        # loop-policy, ctypes pid probes, tzdata); it must be exercised, not
        # assumed.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Run unit tests with coverage
        run: |
          uv run coverage run -m pytest -m "not mysql and not redis"
          uv run coverage report --fail-under=78
      - name: Hot-reload regression suite
        run: uv run pytest tests/test_reload.py -v

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: pyline
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Run integration tests against service containers
        run: uv run pytest -m "integration or mysql or redis"
